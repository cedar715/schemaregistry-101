name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

      # download it from the run's page: Actions -> build -> Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: sr-backup-jar
          path: build/libs/sr-backup.jar
